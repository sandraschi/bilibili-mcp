[project]
name = "bilibili-mcp"
version = "0.1.0"
description = "Bilibili (Chinese video platform) bridge - search, trending, video intel and transcript summarization"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=3.5",
    "respx>=0.21",
    "ruff>=0.5",
    "pyright>=1.1.370",
    "pywinauto>=0.6.9",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "pyinstaller>=6.22.3",
    "pefile>=2024.8.26",
    "altgraph>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bilibili_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "webapp", "mcpb", "docs", "assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "T20"]
ignore = ["E501"]
per-file-ignores = { "scripts/*.py" = ["T20"] }

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=bilibili_mcp --cov-report=term-missing --cov-fail-under=60"

[tool.pyright]
include = ["src"]
exclude = ["webapp", "mcpb", ".venv"]
pythonVersion = "3.11"
